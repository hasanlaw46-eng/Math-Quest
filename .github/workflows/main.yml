
name: Build Math Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q MathQuest_Project_Fixed.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found in ZIP"
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Math-Quest-APK
          path: app/build/outputs/apk/debug/app-debug.apk
